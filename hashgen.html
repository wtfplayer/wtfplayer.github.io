<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hash Generator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f3ee;
  --card:#ffffff;
  --border:#e2dfd8;
  --border2:#ccc9c0;
  --text:#1a1916;
  --sub:#7a776e;
  --hint:#b0ada4;
  --green:#2d6a4f;
  --green-bg:#edf7f2;
  --green-border:#a8d5c2;
  --mono:'DM Mono',monospace;
  --sans:'DM Sans',sans-serif;
  --r:12px;
  --r-sm:8px;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:48px 20px 80px;
}
.page{width:100%;max-width:680px}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:40px;
}
.wordmark{
  font-family:var(--sans);
  font-size:22px;
  font-weight:600;
  letter-spacing:-0.02em;
}
.wordmark sup{
  font-size:10px;
  font-weight:400;
  color:var(--hint);
  letter-spacing:0.05em;
  vertical-align:super;
  margin-left:2px;
}
.badge{
  font-family:var(--mono);
  font-size:10px;
  color:var(--sub);
  background:var(--border);
  padding:4px 10px;
  border-radius:99px;
  letter-spacing:0.04em;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:28px;
  margin-bottom:12px;
}
.label{
  font-size:11px;
  font-weight:500;
  color:var(--hint);
  letter-spacing:0.08em;
  text-transform:uppercase;
  margin-bottom:12px;
}
textarea{
  width:100%;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  color:var(--text);
  font-family:var(--mono);
  font-size:13px;
  line-height:1.7;
  padding:14px 16px;
  resize:none;
  outline:none;
  height:110px;
  transition:border-color 0.15s;
  caret-color:var(--text);
}
textarea:focus{border-color:var(--border2)}
textarea::placeholder{color:var(--hint)}
.meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:8px;
}
.bytes{
  font-family:var(--mono);
  font-size:11px;
  color:var(--hint);
}
.algo-row{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:18px;
}
.pill{
  font-family:var(--mono);
  font-size:11px;
  font-weight:500;
  padding:5px 12px;
  border-radius:99px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--sub);
  cursor:pointer;
  transition:all 0.12s;
  letter-spacing:0.03em;
}
.pill:hover{border-color:var(--border2);color:var(--text)}
.pill.on{background:var(--text);border-color:var(--text);color:#fff}
.gen{
  font-family:var(--sans);
  font-size:13px;
  font-weight:500;
  padding:11px 24px;
  border-radius:var(--r-sm);
  background:var(--text);
  color:#fff;
  border:none;
  cursor:pointer;
  transition:all 0.12s;
  letter-spacing:-0.01em;
  margin-top:20px;
  width:100%;
}
.gen:hover{opacity:0.82}
.gen:active{transform:scale(0.985)}
.gen:disabled{opacity:0.5;cursor:not-allowed}
.section-label{
  font-size:11px;
  font-weight:500;
  color:var(--hint);
  letter-spacing:0.08em;
  text-transform:uppercase;
  margin-bottom:10px;
}
.results-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  overflow:hidden;
}
.row{
  display:grid;
  grid-template-columns:80px 1fr auto;
  align-items:center;
  gap:0;
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  animation:rowIn 0.2s ease both;
}
.row:last-child{border-bottom:none}
.row:hover{background:#faf9f7}
.row:nth-child(1){animation-delay:0.03s}
.row:nth-child(2){animation-delay:0.07s}
.row:nth-child(3){animation-delay:0.11s}
.row:nth-child(4){animation-delay:0.15s}
.row:nth-child(5){animation-delay:0.19s}
.algo{
  font-family:var(--mono);
  font-size:10px;
  font-weight:500;
  letter-spacing:0.06em;
  color:var(--sub);
  text-transform:uppercase;
}
.val{
  font-family:var(--mono);
  font-size:12px;
  color:var(--text);
  word-break:break-all;
  line-height:1.55;
  padding:0 16px;
}
.val.empty{color:var(--hint)}
.copy{
  font-family:var(--mono);
  font-size:10px;
  font-weight:500;
  letter-spacing:0.04em;
  padding:5px 10px;
  border-radius:6px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--sub);
  cursor:pointer;
  transition:all 0.12s;
  white-space:nowrap;
  user-select:none;
}
.copy:hover{background:var(--bg);border-color:var(--border2);color:var(--text)}
.copy.ok{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
.empty-state{
  padding:40px 20px;
  text-align:center;
  color:var(--hint);
  font-size:13px;
}
footer{
  margin-top:32px;
  text-align:center;
  font-size:11px;
  color:var(--hint);
  letter-spacing:0.03em;
}
@keyframes rowIn{
  from{opacity:0;transform:translateY(4px)}
  to{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="wordmark">hashgen<sup>tool</sup></div>
    <div class="badge">client-side only</div>
  </header>

  <div class="card">
    <div class="label">Input</div>
    <textarea id="inp" placeholder="Type or paste anything — text, JSON, a password..." spellcheck="false"></textarea>
    <div class="meta">
      <span class="bytes" id="bytes">0 bytes</span>
    </div>
    <div class="algo-row" id="pills">
      <button class="pill on" data-a="SHA-1">SHA-1</button>
      <button class="pill on" data-a="SHA-256">SHA-256</button>
      <button class="pill on" data-a="SHA-384">SHA-384</button>
      <button class="pill on" data-a="SHA-512">SHA-512</button>
      <button class="pill" data-a="MD5">MD5</button>
    </div>
    <button class="gen" id="gen">Generate hashes</button>
  </div>

  <div class="section-label">Output</div>

  <div class="results-card" id="out">
    <div class="empty-state">Enter text above and click generate</div>
  </div>

  <footer>All processing happens in your browser &mdash; nothing is sent anywhere.</footer>

</div>
<script>
const inp=document.getElementById('inp');
const bytesEl=document.getElementById('bytes');
const out=document.getElementById('out');
const genBtn=document.getElementById('gen');
const active=new Set(['SHA-1','SHA-256','SHA-384','SHA-512']);

inp.addEventListener('input',()=>{
  const b=new TextEncoder().encode(inp.value).length;
  bytesEl.textContent=b.toLocaleString()+' byte'+(b===1?'':'s');
});

document.getElementById('pills').addEventListener('click',e=>{
  const btn=e.target.closest('.pill');
  if(!btn)return;
  const a=btn.dataset.a;
  if(active.has(a)){if(active.size>1){active.delete(a);btn.classList.remove('on');}}
  else{active.add(a);btn.classList.add('on');}
});

function copyText(text,btn){
  const fallback=()=>{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.focus();ta.select();
    try{document.execCommand('copy');}catch(_){}
    document.body.removeChild(ta);
    flash(btn);
  };
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>flash(btn)).catch(fallback);
  } else {
    fallback();
  }
}

function flash(btn){
  btn.textContent='copied!';
  btn.classList.add('ok');
  setTimeout(()=>{btn.textContent='copy';btn.classList.remove('ok');},1600);
}

function md5(str){
  function sa(x,y){const l=(x&0xffff)+(y&0xffff);return(((x>>16)+(y>>16)+(l>>16))<<16)|(l&0xffff);}
  function r(n,c){return(n<<c)|(n>>>(32-c));}
  function cm(q,a,b,x,s,t){return sa(r(sa(sa(a,q),sa(x,t)),s),b);}
  function ff(a,b,c,d,x,s,t){return cm((b&c)|((~b)&d),a,b,x,s,t);}
  function gg(a,b,c,d,x,s,t){return cm((b&d)|(c&(~d)),a,b,x,s,t);}
  function hh(a,b,c,d,x,s,t){return cm(b^c^d,a,b,x,s,t);}
  function ii(a,b,c,d,x,s,t){return cm(c^(b|(~d)),a,b,x,s,t);}
  function go(x,l){
    x[l>>5]|=0x80<<(l%32);x[(((l+64)>>>9)<<4)+14]=l;
    let a=1732584193,b=-271733879,c=-1732584194,d=271733878;
    for(let i=0;i<x.length;i+=16){
      const[oa,ob,oc,od]=[a,b,c,d];
      a=ff(a,b,c,d,x[i],7,-680876936);d=ff(d,a,b,c,x[i+1],12,-389564586);c=ff(c,d,a,b,x[i+2],17,606105819);b=ff(b,c,d,a,x[i+3],22,-1044525330);
      a=ff(a,b,c,d,x[i+4],7,-176418897);d=ff(d,a,b,c,x[i+5],12,1200080426);c=ff(c,d,a,b,x[i+6],17,-1473231341);b=ff(b,c,d,a,x[i+7],22,-45705983);
      a=ff(a,b,c,d,x[i+8],7,1770035416);d=ff(d,a,b,c,x[i+9],12,-1958414417);c=ff(c,d,a,b,x[i+10],17,-42063);b=ff(b,c,d,a,x[i+11],22,-1990404162);
      a=ff(a,b,c,d,x[i+12],7,1804603682);d=ff(d,a,b,c,x[i+13],12,-40341101);c=ff(c,d,a,b,x[i+14],17,-1502002290);b=ff(b,c,d,a,x[i+15],22,1236535329);
      a=gg(a,b,c,d,x[i+1],5,-165796510);d=gg(d,a,b,c,x[i+6],9,-1069501632);c=gg(c,d,a,b,x[i+11],14,643717713);b=gg(b,c,d,a,x[i],20,-373897302);
      a=gg(a,b,c,d,x[i+5],5,-701558691);d=gg(d,a,b,c,x[i+10],9,38016083);c=gg(c,d,a,b,x[i+15],14,-660478335);b=gg(b,c,d,a,x[i+4],20,-405537848);
      a=gg(a,b,c,d,x[i+9],5,568446438);d=gg(d,a,b,c,x[i+14],9,-1019803690);c=gg(c,d,a,b,x[i+3],14,-187363961);b=gg(b,c,d,a,x[i+8],20,1163531501);
      a=gg(a,b,c,d,x[i+13],5,-1444681467);d=gg(d,a,b,c,x[i+2],9,-51403784);c=gg(c,d,a,b,x[i+7],14,1735328473);b=gg(b,c,d,a,x[i+12],20,-1926607734);
      a=hh(a,b,c,d,x[i+5],4,-378558);d=hh(d,a,b,c,x[i+8],11,-2022574463);c=hh(c,d,a,b,x[i+11],16,1839030562);b=hh(b,c,d,a,x[i+14],23,-35309556);
      a=hh(a,b,c,d,x[i+1],4,-1530992060);d=hh(d,a,b,c,x[i+4],11,1272893353);c=hh(c,d,a,b,x[i+7],16,-155497632);b=hh(b,c,d,a,x[i+10],23,-1094730640);
      a=hh(a,b,c,d,x[i+13],4,681279174);d=hh(d,a,b,c,x[i],11,-358537222);c=hh(c,d,a,b,x[i+3],16,-722521979);b=hh(b,c,d,a,x[i+6],23,76029189);
      a=hh(a,b,c,d,x[i+9],4,-640364487);d=hh(d,a,b,c,x[i+12],11,-421815835);c=hh(c,d,a,b,x[i+15],16,530742520);b=hh(b,c,d,a,x[i+2],23,-995338651);
      a=ii(a,b,c,d,x[i],6,-198630844);d=ii(d,a,b,c,x[i+7],10,1126891415);c=ii(c,d,a,b,x[i+14],15,-1416354905);b=ii(b,c,d,a,x[i+5],21,-57434055);
      a=ii(a,b,c,d,x[i+12],6,1700485571);d=ii(d,a,b,c,x[i+3],10,-1894986606);c=ii(c,d,a,b,x[i+10],15,-1051523);b=ii(b,c,d,a,x[i+1],21,-2054922799);
      a=ii(a,b,c,d,x[i+8],6,1873313359);d=ii(d,a,b,c,x[i+15],10,-30611744);c=ii(c,d,a,b,x[i+6],15,-1560198380);b=ii(b,c,d,a,x[i+13],21,1309151649);
      a=ii(a,b,c,d,x[i+4],6,-145523070);d=ii(d,a,b,c,x[i+11],10,-1120210379);c=ii(c,d,a,b,x[i+2],15,718787259);b=ii(b,c,d,a,x[i+9],21,-343485551);
      a=sa(a,oa);b=sa(b,ob);c=sa(c,oc);d=sa(d,od);
    }
    return[a,b,c,d];
  }
  function s2b(s){const a=[];for(let i=0;i<s.length*8;i+=8)a[i>>5]|=(s.charCodeAt(i/8)&0xff)<<(i%32);return a;}
  function b2h(b){const h='0123456789abcdef';let s='';for(let i=0;i<b.length*4;i++)s+=h[(b[i>>2]>>((i%4)*8+4))&0xf]+h[(b[i>>2]>>((i%4)*8))&0xf];return s;}
  const e=unescape(encodeURIComponent(str));
  return b2h(go(s2b(e),e.length*8));
}

async function shaHash(algo,text){
  const buf=await crypto.subtle.digest(algo,new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function generate(){
  const text=inp.value;
  const order=['SHA-1','SHA-256','SHA-384','SHA-512','MD5'].filter(a=>active.has(a));
  if(!order.length)return;

  genBtn.textContent='Computing...';
  genBtn.disabled=true;
  out.innerHTML='';

  for(const algo of order){
    const row=document.createElement('div');
    row.className='row';

    const algoEl=document.createElement('div');
    algoEl.className='algo';
    algoEl.textContent=algo;

    const valEl=document.createElement('div');
    valEl.className='val';

    const copyBtn=document.createElement('button');
    copyBtn.className='copy';
    copyBtn.textContent='copy';

    row.appendChild(algoEl);
    row.appendChild(valEl);
    row.appendChild(copyBtn);
    out.appendChild(row);

    if(!text){
      valEl.className='val empty';
      valEl.textContent='no input';
      copyBtn.style.visibility='hidden';
    } else {
      valEl.textContent='...';
      try{
        let hash;
        if(algo==='MD5') hash=md5(text);
        else hash=await shaHash(algo,text);
        valEl.textContent=hash;
        copyBtn.addEventListener('click',()=>copyText(hash,copyBtn));
      } catch(err){
        valEl.textContent='error';
        valEl.style.color='#e24b4a';
      }
    }
  }

  genBtn.textContent='Generate hashes';
  genBtn.disabled=false;
}

genBtn.addEventListener('click',generate);
inp.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')generate();});
</script>
</body>
</html>
