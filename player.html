<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .player {
    background: #1a1a1a;
    border-radius: 16px;
    padding: 28px;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .track-name { font-size: 18px; font-weight: bold; text-align: center; }
  .track-artist { font-size: 13px; color: #888; text-align: center; margin-top: -12px; }
  input[type="range"] { width: 100%; accent-color: #1db954; cursor: pointer; }
  .time-row { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-top: -10px; }
  .btn-row { display: flex; align-items: center; justify-content: center; gap: 20px; }
  button { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; opacity: 0.8; transition: opacity 0.15s; }
  button:hover { opacity: 1; }
  #playBtn { background: #1db954; color: #000; width: 50px; height: 50px; border-radius: 50%; font-size: 20px; display: flex; align-items: center; justify-content: center; opacity: 1; }
  #repeatBtn.on { color: #1db954; }
  .repeat-status { text-align: center; font-size: 12px; color: #555; margin-top: -10px; }
  .repeat-status.on { color: #1db954; }
  .vol-row { display: flex; align-items: center; gap: 10px; font-size: 16px; color: #888; }
  .tracks { display: flex; flex-direction: column; gap: 8px; }
  .track-item { padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; color: #aaa; transition: background 0.15s; }
  .track-item:hover { background: #222; }
  .track-item.active { background: #222; color: #fff; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2a2a2a; border: 1px solid #333; color: #fff; font-size: 13px; padding: 10px 20px; border-radius: 20px; opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="player">
  <div class="tracks">
    <div class="track-item active" onclick="selectTrack(0)">🎵 Bounce</div>
    <div class="track-item" onclick="selectTrack(1)">🎵 Fav Eater</div>
  </div>
  <div class="track-name" id="name">Bounce</div>
  <div class="track-artist">YXNGMO</div>
  <input type="range" id="progress" min="0" max="100" value="0" step="0.1">
  <div class="time-row">
    <span id="cur">0:00</span>
    <span id="dur">0:00</span>
  </div>
  <div class="btn-row">
    <button onclick="prev()">⏮</button>
    <button id="playBtn" onclick="togglePlay()">▶</button>
    <button onclick="next()">⏭</button>
    <button id="repeatBtn" onclick="toggleRepeat()">🔁</button>
  </div>
  <div class="repeat-status" id="repeatStatus">Repeat: OFF</div>
  <div class="vol-row">
    🔊
    <input type="range" id="vol" min="0" max="100" value="80">
  </div>
</div>
<div class="toast" id="toast"></div>
<audio id="audio" src="SpotiMate_io_-_Bounce_-_YXNGMO_A.mp3" preload="auto"></audio>
<script>
  const songs = [
    { name: 'Bounce', src: 'SpotiMate_io_-_Bounce_-_YXNGMO_A.mp3' },
    { name: 'Fav Eater', src: 'SpotiMate_io_-_Fav_Eater_-_YXNGMO_A.mp3' }
  ];
  let cur = 0, playing = false, repeat = false, toastTimer = null;
  const audio = document.getElementById('audio');
  audio.volume = 0.8;

  function fmt(s) { s = Math.floor(s); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function selectTrack(i) {
    cur = i;
    audio.src = songs[i].src;
    document.getElementById('name').textContent = songs[i].name;
    document.querySelectorAll('.track-item').forEach((el, j) => el.classList.toggle('active', j === i));
    audio.load();
    if (playing) audio.play();
    showToast('▶ Now playing: ' + songs[i].name);
  }

  function togglePlay() {
    if (playing) {
      audio.pause(); playing = false;
      document.getElementById('playBtn').textContent = '▶';
      showToast('⏸ Paused');
    } else {
      audio.play(); playing = true;
      document.getElementById('playBtn').textContent = '⏸';
      showToast('▶ Playing');
    }
  }

  function prev() { selectTrack((cur - 1 + songs.length) % songs.length); }
  function next() { selectTrack((cur + 1) % songs.length); }

  function toggleRepeat() {
    repeat = !repeat;
    audio.loop = repeat;
    document.getElementById('repeatBtn').classList.toggle('on', repeat);
    const s = document.getElementById('repeatStatus');
    s.textContent = 'Repeat: ' + (repeat ? 'ON' : 'OFF');
    s.classList.toggle('on', repeat);
    showToast(repeat ? '🔁 Repeat ON' : '🔁 Repeat OFF');
  }

  document.getElementById('progress').addEventListener('input', e => {
    if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
  });
  document.getElementById('vol').addEventListener('input', e => { audio.volume = e.target.value / 100; });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    document.getElementById('progress').value = (audio.currentTime / audio.duration) * 100;
    document.getElementById('cur').textContent = fmt(audio.currentTime);
    document.getElementById('dur').textContent = fmt(audio.duration);
  });

  audio.addEventListener('ended', () => {
    if (repeat) {
      showToast('🔁 Looping: ' + songs[cur].name);
    } else {
      next();
    }
  });
</script>
</body>
</html>
